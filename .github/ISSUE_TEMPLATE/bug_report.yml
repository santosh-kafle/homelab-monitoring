name: Bug report
description: Something doesn't work, or works differently than the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Before you post, remove anything private from the
        output below: your Grafana password, your ntfy topic, IP addresses you'd
        rather not share.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Run `git describe --tags` in the project folder."
      placeholder: v0.4.0
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distro
      description: "Run `grep PRETTY_NAME /etc/os-release`."
      placeholder: Ubuntu 24.04 LTS
    validations:
      required: true

  - type: dropdown
    id: machine
    attributes:
      label: What kind of machine?
      options:
        - Laptop
        - Desktop
        - Home server / mini PC
        - Raspberry Pi
        - Virtual machine
        - Other
    validations:
      required: true

  - type: textarea
    id: docker-version
    attributes:
      label: Docker version
      description: "Run `docker version` and `docker compose version`, paste both."
      render: text
    validations:
      required: true

  - type: textarea
    id: install-output
    attributes:
      label: Output of the script
      description: "If install.sh, update.sh or uninstall.sh failed, paste everything it printed."
      render: text

  - type: textarea
    id: status
    attributes:
      label: Container status and logs
      description: |
        Run `docker compose ps`, and `docker compose logs --tail 50 <service>` for the
        one that's misbehaving (prometheus, grafana, node-exporter, cadvisor or alertmanager).
      render: text

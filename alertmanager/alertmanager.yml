route:
  receiver: ntfy
  #one message per alert type, eg both disks in one DiskAlmostFull message
  group_by: ['alertname']
  #wait a bit after the first alert in case related ones arrive with it
  group_wait: 30s
  #how long before sending an update when a new alert joins a group
  group_interval: 5m
  #reminder if its still firing. more often than this is just nagging on a laptop
  repeat_interval: 6h

receivers:
  #push notifications to your phone with ntfy. alertmanager has no ntfy receiver of
  #its own, so it posts its json to ntfy, and ?template=alertmanager in the url makes
  #ntfy turn that into a readable message. the url is the secret (anyone who knows
  #the topic can read it), so it lives in secrets/, which git ignores.
  #install.sh creates it if you say yes. without it alerts only show up on :9093
  - name: ntfy
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ntfy_url
